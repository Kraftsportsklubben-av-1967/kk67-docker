services:
  kk67_be:
    build: ./webroot/kk67-backend
    hostname: kk67_be
    container_name: kk67_be
    working_dir: /usr/src/app
    ports:
      - "5000:5000"
    volumes:
      - ${BE_APP_PATH}:/usr/src/app:rw
    profiles:
      - "dev"

  kk67_fe:
    image: node:20-alpine
    hostname: kk67_fe
    container_name: kk67_fe
    command:  sh -c "corepack enable && yarn install && yarn dev:host --port 3000 --strictPort"
    environment:
      - NODE_ENV=development
    ports:
      - "${FE_PORT}:3000"
      - "${FE_PROXY_PORT}:${FE_PROXY_PORT}"
    working_dir: /usr/src/app
    volumes:
      - ${FE_APP_PATH}:/usr/src/app:rw
  kk67_php:
    image: kk67_php:latest
    build: ./webroot/kk67-backend-php
    hostname: kk67_php
    container_name: kk67_php
    working_dir: /usr/src/app
    env_file:
      - ./webroot/kk67-backend-php/.env
    ports:
      - "${BE_PHP_PORT}:4000"
    volumes:
      - ${BE_PHP_APP_PATH}:/usr/src/app:rw
